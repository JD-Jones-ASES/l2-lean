status:
  scope: >-
    Ten compared declarations over one compared definition, Langford.IsLangford. They characterize
    two-fold Langford sequences, give the necessary conditions for every m and their attainment on
    the tight line, settle the row of order one, exclude the cell (6, 3) at m = 3, and show that for
    every m >= 3 the necessary conditions are not sufficient. Four more hold for every m: the residue
    bound (Langford.residue_bound), the forced-endpoint bound (Langford.forced_endpoint), the empty
    cells (3m - 3, 3) for m >= 3 (Langford.not_order_three) and the rigidity of the counting bound
    (Langford.tight_iff_straddle). No complete existence characterization for m >= 3 is claimed (the
    tight line and the row l = 1 are the only sufficient families proved), and no count of
    sequences; the note's linear-relaxation results, including its certificate-family theorems, are
    not formalized. The intentional placeholders of Challenge.lean are excluded from proof counts;
    Solution.lean does not import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Langford.twoFold_exists_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Langford.necessary"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Langford.tight_exists"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Langford.order_one_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Langford.not_threeFold_six_three"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Langford.not_sufficient"
      file: "Solution.lean"
      sorry_count: 0
