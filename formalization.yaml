automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)", "GPT-6 (OpenAI)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) was used throughout; the theorems,
        their proofs, the searches, the checkers and the repository were produced in that process. A
        review of the six-theorem version by an OpenAI model proposed the residue bound, the
        forced-endpoint bound, the order-three cells and the rigidity statement; they were
        re-derived, checked by exact arithmetic and then formalized.
        Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55)
        are pinned by the committed manifest and lake update is never run; there are no GitHub
        Actions workflows. There is no native_decide; the kernel computations are twenty-seven
        literal finite-set equalities and six small closed checks in L2/SixThree.lean (the
        three-element subsets of [7, 12] with sum 33, three interval sums, two cardinalities).
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md."

fidelity:
  divergences: >-
    The sequence form of the source is written with the pairs made explicit: for each p a set A of
    m left ends with a + p outside A, and the positions carrying p exactly A and A + p. The pairs
    are a chosen partition of the occurrences of p, so four copies at a, a + p, a + 2p, a + 3p are
    allowed; this is the reading of Baker, Nowakowski, Shalaby and Sharary, whom the source cites
    for m-fold sequences, and without it the in-bound cells (d, l) = (1, 1), (5, 4) and (6, 6) would
    have no sequence. Intervals are stated as bounds rather than interval constants. The sequence
    is a function from the natural numbers, read on the positions 1, ..., 2ml; values at other
    positions are ignored. The hypotheses d >= 1 and l >= 1 are required: for l = 0 the empty
    sequence qualifies, and the source's parameters are positive.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents
    developed and cross-reviewed the proof, the statements were checked against the source text, and
    VERIFICATION.md states what is checked and what is not. Mechanical correctness and agreement of
    formal statements do not establish priority or significance.

alignment:
  namespace: "Langford"
  statements:
    - source: "Alkasasbeh-Dyer-Howell, arXiv:2112.04265, Section 7 (the question), answered for m = 2"
      lean: "Langford.twoFold_exists_iff"
      module: "Solution"
      status: "proved"
      note: >-
        For d, l >= 1 a two-fold Langford sequence of order l and defect d exists if and only if
        3l >= 2d - 1.
    - source: "The counting bound for every m, re-proved in the sequence form; Nordh, Perfect Skolem sets, Theorem 6 and Corollary 7 reduce to it"
      lean: "Langford.necessary"
      module: "Solution"
      status: "proved"
      note: >-
        Every m-fold sequence satisfies 2d + l <= 2ml + 1, and for odd m also
        l(2d + l + 1) = 0 (mod 4); at m = 1 these are the classical conditions.
    - source: "Alkasasbeh-Dyer-Howell, Table 1, extended to every m; Nordh, Perfect Skolem sets, Theorem 15 is the same bijection in multiset form"
      lean: "Langford.tight_exists"
      module: "Solution"
      status: "proved"
      note: >-
        If 2d + l = 2ml + 1, an m-fold sequence exists: m interleaved copies of Table 1.
    - source: "This development: the row of order one"
      lean: "Langford.order_one_iff"
      module: "Solution"
      status: "proved"
      note: "An m-fold sequence of order 1 and defect d exists if and only if d divides m."
    - source: "This development: an empty cell that meets the necessary conditions"
      lean: "Langford.not_threeFold_six_three"
      module: "Solution"
      status: "proved"
      note: "No three-fold sequence of order 3 and defect 6 exists."
    - source: "This development: the necessary conditions are not sufficient for m >= 3"
      lean: "Langford.not_sufficient"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 3 some (d, l) with d, l >= 1 meets the conditions of necessary and admits
        no m-fold sequence: (6, 3) for m = 3, (m - 1, 1) for even m, (m - 2, 1) for odd m >= 5.
    - source: "This development: the residue bound"
      lean: "Langford.residue_bound"
      module: "Solution"
      status: "proved"
      note: >-
        For every T >= 1, with r = ml mod T, every m-fold sequence satisfies
        r(T - r) <= m * sum |p - T| over p in [d, d + l - 1], the distance written as
        (p - T) + (T - p) with truncated subtraction at p = d + i, i < l.
    - source: "This development: the forced-endpoint bound"
      lean: "Langford.forced_endpoint"
      module: "Solution"
      status: "proved"
      note: >-
        Every m-fold sequence satisfies 6mld + ml <= 4d^2 + 2(ml)^2 + ml^2, that is
        ml * e <= (l - 1 + e)^2 for the excess e = (2m - 1)l - 2d + 1.
    - source: "This development: one empty order-three cell for every m >= 3"
      lean: "Langford.not_order_three"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 3 the cell (d, l) = (3m - 3, 3) meets the conditions of necessary and admits
        no m-fold sequence.
    - source: "This development: the rigidity of the counting bound"
      lean: "Langford.tight_iff_straddle"
      module: "Solution"
      status: "proved"
      note: >-
        An m-fold sequence has 2d + l = 2ml + 1 if and only if ml < i + s i for every position
        i <= ml, that is, every pair straddles the middle.

