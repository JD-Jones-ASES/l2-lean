version: "v0.4"

project:
  name: "Two-fold Langford sequences exist exactly when 3l ≥ 2d − 1; the m-fold counting bound and its attainment"
  description: >-
    A Lean 4 characterization of two-fold Langford sequences. An m-fold Langford sequence of order l
    and defect d fills the positions 1, ..., 2ml so that every p in [d, d + l - 1] occupies the
    endpoints of m pairwise disjoint pairs of positions at distance p. For d, l >= 1 a two-fold
    sequence exists exactly when 3l >= 2d - 1. For every m, (2m - 1)l >= 2d - 1 is necessary, with
    l(2d + l + 1) = 0 (mod 4) for odd m, and the bound is attained whenever 2d + l = 2ml + 1; the
    row of order one exists exactly when d divides m; no three-fold sequence of order 3 and defect 6
    exists; and for every m >= 3 the necessary conditions are not sufficient. Alkasasbeh, Dyer and
    Howell define these sequences and ask for necessary and sufficient conditions when m >= 2; this
    repository answers the question for m = 2. Necessity is a distance sum. Sufficiency at m = 2 is
    strong induction on l: sixteen literal cells, concatenation, and otherwise a mirror-symmetric
    sequence built by Lemma S from a signed permutation, which is found on the whole cone by
    inversion, the reversal, a descent along lines of fixed mu, and in the band by 21 block-reversal
    families plus the two-block reversal tau_l, eight sporadic cells and three bases. The tight line
    is m interleaved copies of the source's Table 1.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

